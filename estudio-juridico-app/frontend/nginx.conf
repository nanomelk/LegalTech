server {
    listen 80;
    server_name localhost;

    # Archivos estáticos de React
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para mejor performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ── Proxy reverso hacia el backend FastAPI ────────────────────
    # Todas las rutas /api/* se redirigen al contenedor 'backend'
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ── Proxy para health check del backend ──────────────────────
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ── Archivos estáticos con cache agresivo ─────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA: todas las rutas no encontradas van al index.html ─────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ocultar versión de nginx en headers
    server_tokens off;
}
